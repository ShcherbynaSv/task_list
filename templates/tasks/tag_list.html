{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="display-6 font-weight-bold">Tags</h1>
          </div>

    <a class="btn btn-primary" href="{% url 'create-tag' %}">
      + Create Tag
    </a>
  </div>

  {% if tag_list %}
    <div class="card shadow-sm">
      <div class="card-body">
        <table class="table">
          <tr>
            <th><b>Name</b></th>
            <th><b>Update</b></th>
            <th><b>Delete</b></th>
          </tr>
          {% for tag in tag_list %}
            <tr>
              <td>{{ tag.name }}</td>
              <td>
                <a
                    class="btn btn-secondary"
                    href="{% url 'update-tag' tag.id %}"
                >
                  Update
                </a>
              </td>
              <td>
                <a
                    class="btn btn-secondary"
                    href="{% url 'delete-tag' tag.id %}"
                >
                  Delete
                </a>
              </td>
            </tr>
          {% endfor %}
        </table>
      </div>
    </div>
  {% else %}
    <p>There are no tags yet</p>
  {% endif %}
{% endblock %}
