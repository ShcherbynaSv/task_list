{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Delete task</h1>
  <p>Are you sure you want to delete task: {{ task }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>
{% endblock %}
